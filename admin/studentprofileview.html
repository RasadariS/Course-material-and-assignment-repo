<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Student Profile - DTET</title>
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/common.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 page-admin-studentprofileview-html">
  <div id="header-placeholder"></div>

  <main class="container py-4 flex-fill">
    <h1 class="h3 font-weight-bold mb-4">Student Profile</h1>

    <section class="card shadow-sm mx-auto common-inline-admin-studentprofileview-html-1" aria-label="Student profile details">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img class="rounded-circle border bg-light mb-2 common-inline-admin-studentprofileview-html-2" id="profilePhoto"
               src="../assets/images/person-fill.svg" alt="Student profile photo"
               width="120" height="120">
          <h2 class="h5 mb-0" id="profileName">Student details</h2>
        </div>

        <dl class="row mb-0">
          <dt class="col-sm-4">NIC</dt>
          <dd class="col-sm-8" id="profileNic"></dd>

          <dt class="col-sm-4">Registration Number</dt>
          <dd class="col-sm-8" id="profileRegistrationNumber"></dd>

          <dt class="col-sm-4">Contact Number</dt>
          <dd class="col-sm-8" id="profileContactNumber"></dd>

          <dt class="col-sm-4">Email Address</dt>
          <dd class="col-sm-8" id="profileEmail"></dd>

          <dt class="col-sm-4">Intake Year</dt>
          <dd class="col-sm-8" id="profileIntakeYear"></dd>

          <dt class="col-sm-4">Account Type</dt>
          <dd class="col-sm-8" id="profileRole"></dd>
        </dl>
      </div>
      <div class="card-footer bg-white text-right">
        <a class="btn btn-secondary" href="studentprofile.html">Back to profile</a>
      </div>
    </section>

    <div class="alert alert-warning mt-3 d-none" id="profileNotice" role="alert">
      No profile details were passed to this page. Return to the profile form and select View.
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/js/common.js" data-page="admin/studentprofileview.html"></script>
</body>
</html>
