<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - DTET</title>
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">

  <link href="../assets/css/common.css" rel="stylesheet">
</head>
<body class="page-admin-resetcredentials-html">
  <main class="reset-card" aria-labelledby="resetTitle">
    <img class="reset-logo" src="../assets/images/DTET logo.jpg" alt="DTET Sri Lanka logo">
    <h1 class="h4 text-center mb-3" id="resetTitle">Reset your password</h1>
    <p class="text-muted">
      Enter the email address associated with your account. A verified password-reset service is required to send reset instructions.
    </p>

    <!-- <div class="alert alert-warning" role="note">
      Password reset is not connected yet. Connect this form to a server-side reset flow with email verification before using it.
    </div> -->

    <form action="#" method="post">
      <div class="form-group">
        <label for="emailAddress">Email Address</label>
        <input class="form-control" id="emailAddress" name="email" type="email"
               autocomplete="email" required>
      </div>
      <button class="btn btn-primary" type="submit">Request reset instructions</button>
    </form>

    <p class="text-center mt-3 mb-0">
      <a href="../login.php">Back to login</a>
    </p>
  </main>
</body>
</html>
